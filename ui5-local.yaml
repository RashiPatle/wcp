specVersion: "3.1"
metadata:
  name: com.westernacher.collaborationportal.core
type: application
framework:
  name: SAPUI5
  version: 1.79.0
  libraries:
    - name: sap.f
    - name: sap.m
    - name: sap.ui.core
    - name: sap.viz
    - name: sap.ui.comp
    - name: sap.ui.generic.app
    - name: sap.ui.table
    - name: sap.ushell
    - name: themelib_sap_bluecrystal
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /sap
            url: http://td4.wup.services:5001
            client: "100"
            destination: TM_TD4_100_RAPTogether
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: com.westernacher.collaborationportal.core
        ui5Theme: sap_fiori_3
